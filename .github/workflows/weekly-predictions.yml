name: Weekly NFL predictions refresh

# Runs on GitHub's own schedule, independent of any chat session or laptop
# being open. GitHub only activates a `schedule` trigger once this file is
# present on the repository's default branch -- so this starts firing once
# PR #1 (which adds this file) is merged into main. Until then, use the
# "Run workflow" button (workflow_dispatch, below) to test it manually on
# this branch.
on:
  schedule:
    # Wednesdays 13:17 UTC -- after Monday/Thursday night games are final
    # and that week's rolling stats have settled, before the bulk of that
    # week's injury-report and lineup news comes in. Off the top of the
    # hour on purpose (avoids every scheduled workflow across GitHub piling
    # onto :00).
    - cron: "17 13 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine current NFL season
        id: season
        run: |
          MONTH=$(date -u +%-m)
          YEAR=$(date -u +%Y)
          # NFL seasons are labeled by the year they start (September) and
          # run into Jan/Feb of the following calendar year.
          if [ "$MONTH" -le 2 ]; then
            echo "value=$((YEAR - 1))" >> "$GITHUB_OUTPUT"
          else
            echo "value=$YEAR" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull this season's current raw data
        run: python -m src.predict.pull_current_season ${{ steps.season.outputs.value }}

      - name: Run the predictor
        run: python -m src.predict.live_predict ${{ steps.season.outputs.value }}

      - name: Open a PR with the refreshed predictions, if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if git diff --quiet -- data/processed/predictions_*.csv 2>/dev/null && \
             [ -z "$(git status --porcelain data/processed/predictions_*.csv 2>/dev/null)" ]; then
            echo "No change in predictions output -- skipping PR."
            exit 0
          fi

          DATE_TAG=$(date -u +%Y%m%d)
          BRANCH="auto/weekly-predictions-${DATE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/processed/predictions_*.csv
          git commit -m "Weekly prediction refresh ($(date -u +%F))"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Weekly NFL predictions refresh ($(date -u +%F))" \
            --body "Automated weekly re-run of \`src/predict/live_predict.py\`. Only the predictions CSV changed here -- no pipeline code was touched by this run. Read the caveats the script printed in the job log before trusting the numbers, especially early in a season. Generated by \`.github/workflows/weekly-predictions.yml\`."
